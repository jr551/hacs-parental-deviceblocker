plugins {
    id "com.android.application"
}

android {
    namespace "lol.rowe.blocker"
    compileSdk 35

    defaultConfig {
        applicationId "lol.rowe.blocker"
        minSdk 29
        targetSdk 35
        versionCode 16
        versionName "0.4.10"

        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    def releaseStore = System.getenv("PDB_STORE_FILE")

    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword System.getenv("PDB_STORE_PASSWORD")
                keyAlias System.getenv("PDB_KEY_ALIAS")
                keyPassword System.getenv("PDB_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            debuggable false
            minifyEnabled false
            if (releaseStore) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
