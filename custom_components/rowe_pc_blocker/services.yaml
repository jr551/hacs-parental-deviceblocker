# Services the integration registers. Home Assistant reads this to describe
# them in the UI and the service developer tools.
send_challenge:
  name: Send chore challenge
  description: >-
    Lock the phone until the child types the phrase back and sends a photo as
    evidence. The phone picks the challenge up on its next state poll, and the
    child waits for a parent to approve the photo before it unlocks.
  target:
    entity:
      integration: rowe_pc_blocker
      domain: sensor
  fields:
    phrase:
      name: Phrase
      description: The text the child must type back, for example "I have brushed my teeth".
      required: true
      example: I have brushed my teeth
      selector:
        text:

approve_challenge:
  name: Approve chore challenge
  description: >-
    Approve the photo a child submitted. The challenge leaves the phone's state
    payload, so the phone unlocks on its next poll. The sensor becomes
    approved. A submitted challenge approves itself two hours after the child
    sent it, so this is only needed to decide sooner.
  target:
    entity:
      integration: rowe_pc_blocker
      domain: sensor

reject_challenge:
  name: Reject chore challenge
  description: >-
    Send a submitted challenge back to the child and delete its photo, so the
    chore can be done again. The sensor returns to pending. Rejecting before
    the two-hour deadline beats the automatic approval.
  target:
    entity:
      integration: rowe_pc_blocker
      domain: sensor

clear_challenge:
  name: Clear chore challenge
  description: >-
    Cancel the active challenge, approved or not, and delete its photo
    evidence.
  target:
    entity:
      integration: rowe_pc_blocker
      domain: sensor
