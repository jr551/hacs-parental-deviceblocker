# Parental Device Blocker - accessibility service switched off.
#
# Turning the accessibility service off is the one tamper that silently
# disables everything on a phone: no block screen, no challenge, no overdue
# phone behaviour. The phone still checks in, so it looks healthy in every other
# place, which is exactly why it needs its own alert.
#
# "Sure" means: the phone *reports* accessibility_disabled and its agent is
# still checking in. A phone that is simply off or unreachable goes
# `unavailable`, and that is a different problem (see the agent-stale alert), so
# it must not raise this one.
#
# The check runs every five minutes rather than reacting to the single state
# change, so a Home Assistant restart cannot lose the alert, and the notice is
# keyed per phone so repeated checks update it instead of stacking up.
#
# Deploy to /config/automations/rowe_pc_blocker_accessibility_off.yaml and
# reload automations. Uses the live ha-notify Hermes route.
- id: parental_device_blocker_accessibility_off_alert
  alias: Parental Device Blocker - Accessibility switched off
  description: >-
    Alerts a parent when a child's phone reports that its accessibility service
    is off while the phone itself is still checking in, and clears the notice
    when it comes back.
  mode: single
  max_exceeded: silent
  trigger:
    - platform: time_pattern
      minutes: "/5"
  action:
    - variables:
        # How long it must stay off before a parent hears about it, so a
        # restart of the service during an update does not raise an alarm.
        confirm_minutes: 10
        # Phones that are not a child's device.
        ignored:
          - sensor.nas_android_test_phone_enforcement_status
    - repeat:
        for_each: >-
          {{ states.sensor
             | selectattr('entity_id', 'match', '.*_phone_enforcement_status')
             | map(attribute='entity_id')
             | reject('in', ignored) | list }}
        sequence:
          - variables:
              sensor: "{{ repeat.item }}"
              prefix: >-
                {{ repeat.item | replace('sensor.', '')
                   | replace('_enforcement_status', '') }}
              status: "{{ states(sensor) }}"
              online: "{{ states('binary_sensor.' ~ prefix ~ '_agent_online') }}"
              # How long it has held this state. `last_changed` survives a
              # restart, so a service that went off before the restart still
              # counts.
              # Floored, not rounded: a 5-minute tick must land inside the
              # one-push window exactly once.
              held_minutes: >-
                {{ ((now() - states[repeat.item].last_changed).total_seconds() / 60) | int }}
              friendly: >-
                {{ state_attr('binary_sensor.' ~ prefix ~ '_agent_online',
                              'friendly_name') | replace(' agent online', '')
                   or prefix }}
          - choose:
              # Confirmed off, and the phone is demonstrably still alive.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ status == 'accessibility_disabled'
                         and online == 'on'
                         and held_minutes >= confirm_minutes }}
                sequence:
                  - service: persistent_notification.create
                    data:
                      title: "Accessibility off - {{ friendly }}"
                      message: >-
                        {{ friendly }} has accessibility switched off, so no
                        block, challenge or phone check can be enforced on it.
                        It is still checking in, so the service was turned off
                        on the phone. Lasting {{ held_minutes }} minutes.
                      notification_id: "parental_device_accessibility_{{ prefix }}"
                  # One phone message per episode: only the five-minute check
                  # that lands just past the confirmation window pushes.
                  - if:
                      - condition: template
                        value_template: >-
                          {{ held_minutes < confirm_minutes + 5 }}
                    then:
                      - service: rest_command.notify_john
                        data:
                          message: >-
                            {{ friendly }} has its accessibility service switched
                            off, so nothing is being enforced on it. The phone is
                            still online, so it was turned off deliberately.
            # Anything else is either healthy or genuinely unreachable, and
            # neither is this alert's business.
            default:
              - service: persistent_notification.dismiss
                data:
                  notification_id: "parental_device_accessibility_{{ prefix }}"
