# Example only: replace every entity and notification service before use.
- id: parental_device_blocker_enforcement_health_alert
  alias: Parental Device Blocker - Enforcement Health Alert
  description: >-
    Alerts parents when a powered PC is requested blocked but its agent is offline.
  mode: queued
  max: 10
  trigger:
    - platform: template
      id: kid1
      value_template: >-
        {{ is_state('switch.kid1_pc_blocked', 'on')
           and is_state('binary_sensor.kid1_pc_agent_online', 'off')
           and states('sensor.kid1_pc_power') | float(0) > 10 }}
      for: "00:02:00"
    - platform: template
      id: kid2
      value_template: >-
        {{ is_state('switch.kid2_pc_blocked', 'on')
           and is_state('binary_sensor.kid2_pc_agent_online', 'off')
           and states('sensor.kid2_pc_power') | float(0) > 10 }}
      for: "00:02:00"
  action:
    - variables:
        child: "{{ 'Kid 1' if trigger.id == 'kid1' else 'Kid 2' }}"
        device_id: "{{ 'kid1_pc' if trigger.id == 'kid1' else 'kid2_pc' }}"
        message: >-
          {{ child }}'s PC is powered on and requested blocked, but its blocker
          agent is offline. Treat the PC as unblocked until it reconnects.
    - service: persistent_notification.create
      data:
        title: "PC block could not be enforced - {{ child }}"
        message: "{{ message }}"
        notification_id: "parental_device_enforcement_{{ device_id }}"
    - service: notify.parent_one
      data:
        message: "{{ message }}"
    - service: notify.parent_two
      data:
        message: "{{ message }}"
    - service: notify.mobile_app_parent_phone
      data:
        title: "PC block could not be enforced - {{ child }}"
        message: "{{ message }}"
        data:
          tag: "parental_device_enforcement_{{ device_id }}"
